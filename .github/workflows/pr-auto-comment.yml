name: PR Auto Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  # ── Job 1: Welcome comment when PR is first opened ─────────────────────────
  welcome-comment:
    name: Welcome Comment
    runs-on: ubuntu-latest
    if: github.event.action == 'opened'
    steps:
      - name: Post welcome comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 👋 Welcome to AI Job Agent!

            Thanks for opening this Pull Request, @${{ github.actor }}! 🎉

            Our CI pipeline will now automatically:
            - 🔨 **Build** the Spring Boot application
            - 🧪 **Run** all unit tests
            - 📊 **Report** the results here

            Please wait for the checks to complete. A build status comment will be posted shortly.

            ---
            > **Repository:** \`${{ github.repository }}\`
            > **Branch:** \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`
            > **Triggered by:** @${{ github.actor }}`
            });

  # ── Job 2: Build & Test, then comment with results ─────────────────────────
  build-and-comment:
    name: Build & Test Report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        id: build
        run: |
          mvn clean test --no-transfer-progress 2>&1 | tee build_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Parse test results
        id: test_results
        run: |
          TESTS=$(grep -oP 'Tests run: \K[0-9]+' build_output.txt | awk '{s+=$1} END {print s}')
          FAILURES=$(grep -oP 'Failures: \K[0-9]+' build_output.txt | awk '{s+=$1} END {print s}')
          ERRORS=$(grep -oP 'Errors: \K[0-9]+' build_output.txt | awk '{s+=$1} END {print s}')
          SKIPPED=$(grep -oP 'Skipped: \K[0-9]+' build_output.txt | awk '{s+=$1} END {print s}')
          echo "tests=${TESTS:-0}" >> $GITHUB_OUTPUT
          echo "failures=${FAILURES:-0}" >> $GITHUB_OUTPUT
          echo "errors=${ERRORS:-0}" >> $GITHUB_OUTPUT
          echo "skipped=${SKIPPED:-0}" >> $GITHUB_OUTPUT

      - name: Determine build status
        id: status
        run: |
          if [ "${{ steps.build.outputs.exit_code }}" == "0" ]; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "label=BUILD PASSED" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "label=BUILD FAILED" >> $GITHUB_OUTPUT
          fi

      - name: Get last build log lines (on failure)
        id: log_excerpt
        if: steps.status.outputs.result == 'failure'
        run: |
          EXCERPT=$(tail -30 build_output.txt)
          echo "excerpt<<EOF" >> $GITHUB_OUTPUT
          echo "$EXCERPT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Find existing bot comment
        uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- ai-job-agent-build-report -->'

      - name: Post or update build status comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const result     = '${{ steps.status.outputs.result }}';
            const emoji      = '${{ steps.status.outputs.emoji }}';
            const label      = '${{ steps.status.outputs.label }}';
            const tests      = '${{ steps.test_results.outputs.tests }}';
            const failures   = '${{ steps.test_results.outputs.failures }}';
            const errors     = '${{ steps.test_results.outputs.errors }}';
            const skipped    = '${{ steps.test_results.outputs.skipped }}';
            const runUrl     = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const sha        = '${{ github.event.pull_request.head.sha }}'.substring(0, 7);
            const logExcerpt = `${{ steps.log_excerpt.outputs.excerpt }}`;

            const passed = parseInt(tests) - parseInt(failures) - parseInt(errors);

            const testTable = `
            | Metric | Count |
            |--------|-------|
            | ✅ Passed  | ${passed >= 0 ? passed : 'N/A'} |
            | ❌ Failed  | ${failures} |
            | 💥 Errors  | ${errors} |
            | ⏭️ Skipped | ${skipped} |
            | 📋 Total   | ${tests} |
            `;

            let failureSection = '';
            if (result === 'failure' && logExcerpt) {
              failureSection = `
            ### 🔍 Build Log (last 30 lines)
            \`\`\`
            ${logExcerpt}
            \`\`\`
            `;
            }

            const body = `<!-- ai-job-agent-build-report -->
            ## ${emoji} CI Build Report — ${label}

            > Commit: \`${sha}\` | Branch: \`${{ github.head_ref }}\` | [View Full Logs](${runUrl})

            ### 🧪 Test Results
            ${testTable}
            ${failureSection}
            ---
            <sub>🤖 This comment is auto-updated on every push to this PR.</sub>`;

            const existingCommentId = '${{ steps.find_comment.outputs.comment-id }}';

            if (existingCommentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: parseInt(existingCommentId),
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Fail job if build failed
        if: steps.status.outputs.result == 'failure'
        run: exit 1
